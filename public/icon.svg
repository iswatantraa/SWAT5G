<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Concentric radar pulse arcs -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Central Speedbolt / 5G Emblem -->
  <path d="M280 84 L160 276 L250 276 L224 428 L352 236 L262 236 Z" 
        fill="url(#cyanGrad)" 
        filter="url(#glow)"/>

  <!-- 5GHz Badge text -->
  <text x="256" y="474" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#67e8f9" letter-spacing="4">5 GHz ULTRA</text>
</svg>
